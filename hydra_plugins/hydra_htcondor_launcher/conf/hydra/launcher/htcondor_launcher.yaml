# @package hydra.launcher
_target_: hydra_plugins.hydra_htcondor_launcher.htcondor_launcher.HTCondorLauncher

# HTCondor resource requests
request_memory: "4000"
request_cpus: "1"
request_gpus: "0"

# Optional job constraints
requirements: null

# Maximum job runtime in seconds (default: 8 hours)
MaxTime: 28800

# HTCondor working directory
htcondor_folder: ${hydra.sweep.dir}/.htcondor
